<div class="detalle-video-wrapper">
  <lite-youtube
    videoid="{{id}}"
    playlabel="Play Video"
    style="background-image: url('https://i.ytimg.com/vi/{{id}}/hqdefault.jpg');"

      <span class="lyt-visually-hidden">Play Video</span>
    </a>
  </lite-youtube>
</div>
