<div class="categoria-card">
  <a href="{{link}}">
    <img class="categoria-card__image" src="{{src}}" alt="{{alt}}">
    <div class="categoria-card__content">
      <h3 class="categoria-card__title">{{title}}</h3>
      <p class="categoria-card__description">{{description}}</p>
    </div>
  </a>
</div>
